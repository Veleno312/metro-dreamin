name: Deploy InvoiceSanity

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'invoice-sanity-site/**'
      - '.github/workflows/invoice-sanity-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: invoicesanity-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload InvoiceSanity
        uses: actions/upload-pages-artifact@v4
        with:
          path: invoice-sanity-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
